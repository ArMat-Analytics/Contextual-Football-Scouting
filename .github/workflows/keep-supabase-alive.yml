# =============================================================================
# Keep Supabase Alive – Prevent Free-Tier Pause Due to Inactivity
# =============================================================================
# Supabase pauses free-tier projects after 7 days of inactivity.
# This workflow pings the database every 5 days to reset the counter.
# =============================================================================

name: Keep Supabase Alive

on:
  # ── Scheduled trigger: every 5 days at 06:00 UTC ──────────────────────────
  schedule:
    - cron: "0 6 */5 * *"

  # ── Manual trigger from the Actions tab ────────────────────────────────────
  workflow_dispatch:

jobs:
  ping-supabase:
    name: 🏓 Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send keep-alive request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🔔 Pinging Supabase to prevent inactivity pause..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "📡 HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive and responding."
          else
            echo "❌ Unexpected status code: ${HTTP_STATUS}"
            exit 1
          fi
