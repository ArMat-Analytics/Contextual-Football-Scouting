# =============================================================================
# Keep Supabase Alive – Prevent Free-Tier Pause Due to Inactivity
# =============================================================================
# Supabase pauses free-tier projects after 7 days of inactivity.
# This workflow pings the database every 5 days to reset the counter.
# =============================================================================
name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pinging Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "🔔 Pinging Supabase directly via REST API..."
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          
          echo "📡 HTTP Status: $STATUS"
          
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Supabase is awake!"
          else
            echo "❌ Failed with status: $STATUS."
            exit 1
          fi